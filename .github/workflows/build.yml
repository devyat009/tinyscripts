name: Build Windows Executable

on:
  push:
    branches: [ 'main', 'develop' ]
  pull_request:
    branches: [ 'main', 'develop' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron App Executable
        run: npm run build

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyScripts-Windows-Executable
          path: release/*.exe
